      <stop offset="0" stop-color="#16345E"/>
      <stop offset="1" stop-color="#050F22"/>
    </radialGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE3F5"/>
      <stop offset="1" stop-color="#1E9FE0"/>
